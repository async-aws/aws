name: Build website

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'website/**'
      - 'couscous.yml'
      - '.github/workflows/website.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'async-aws/aws'
    name: Generate
    runs-on: ubuntu-latest

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: 'source'
          persist-credentials: false

      - name: Download Couscous Phar
        run: |
          curl -OSL https://raw.githubusercontent.com/Nyholm/Couscous/twig-production/couscous.phar
          chmod +x couscous.phar

      - name: Generate website
        run: |
          echo "::group::Couscous"
          ./couscous.phar generate --target output source
          echo "::endgroup::"
          echo "::group::Post process"
          cd source/website && npm run post-process `pwd`/../../output
          echo "::endgroup::"

      - name: Upload website
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: output
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download website
        uses: actions/download-artifact@v8
        with:
          name: website
          path: generated

      - name: Checkout Website repo
        uses: actions/checkout@v7
        with:
          repository: async-aws/website
          ref: master
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: output

      - name: Replace the website files
        run: rsync --archive --delete --exclude '.*' generated/ output/

      - name: Commit & push the new files
        run: |
          echo "::group::git status"
          cd output
          git status
          echo "::endgroup::"

          git add -N .
          if [[ $(git diff --numstat | wc -l) -eq 0 ]]; then
            echo "No changes found. Exiting."
            exit 0;
          fi

          git config --local user.email "github@async-aws.com"
          git config --local user.name "AsyncAws Bot"

          echo "::group::git push"
          git add .
          git commit -m "Update website from commit async-aws/aws@${{ github.sha }}"
          git push
          echo "::endgroup::"
